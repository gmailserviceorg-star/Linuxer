name: Build Linuxer ISO

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm gcc-multilib xorriso grub-pc-bin grub-common

      - name: Assemble boot.asm
        run: nasm -f elf32 boot.asm -o boot.o

      - name: Compile kernel.c
        run: gcc -m32 -ffreestanding -fno-pie -nostdlib -c kernel.c -o kernel.o

      - name: Link kernel
        run: ld -m elf_i386 -Ttext 0x100000 -o kernel.bin boot.o kernel.o --oformat elf32-i386

      - name: Build ISO tree
        run: |
          mkdir -p iso/boot/grub
          cp kernel.bin iso/boot/kernel.bin
          cp grub.cfg iso/boot/grub/grub.cfg

      - name: Build ISO
        run: grub-mkrescue -o linuxer.iso iso

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: linuxer-iso
          path: linuxer.iso
